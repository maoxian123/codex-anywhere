[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-anywhere"
version = "0.1.0"
description = "A self-hosted web control plane for Codex on your own machines"
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.1,<4", "flask-sock>=0.7,<1", "Flask-SQLAlchemy>=3.1,<4",
  "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "python-dotenv>=1,<2",
  "websockets>=14,<17", "httpx>=0.28,<1", "Pillow>=11,<13",
  "psutil>=6,<8",
  "gunicorn>=23,<24; platform_system != 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
codex-anywhere = "codex_anywhere.cli:main"

[tool.setuptools.packages.find]
include = ["codex_anywhere*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
