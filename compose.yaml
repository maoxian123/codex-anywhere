services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: codex_anywhere
      POSTGRES_USER: codex_anywhere
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codex_anywhere -d codex_anywhere"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  hub:
    build: .
    environment:
      SECRET_KEY: ${SECRET_KEY:?Run codex-anywhere init first}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Run codex-anywhere init first}
      DATABASE_URL: postgresql+psycopg://codex_anywhere:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/codex_anywhere
      ASSET_DIR: /data/assets
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PUBLIC_URL: ${PUBLIC_URL:-}
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - asset_data:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  asset_data:
